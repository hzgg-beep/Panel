version: '3.8'

services:
  database:
    image: mariadb:10.5
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: PteroPassword123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ptero_net

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_URL: http://139.99.123.120
      APP_TIMEZONE: Asia/Jakarta
      DB_HOST: database
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: PteroPassword123
    volumes:
      - panel_data:/app/storage
    depends_on:
      - database
    networks:
      - ptero_net

volumes:
  db_data:
  panel_data:

networks:
  ptero_net:
    driver: bridge
